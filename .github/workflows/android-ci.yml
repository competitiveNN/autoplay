name: Android CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Run lint
        run: ./gradlew lintDebug

      - name: Validate fastlane metadata
        run: |
          test -f fastlane/metadata/android/en-US/title.txt || (echo "Missing en-US title" && exit 1)
          test -f fastlane/metadata/android/en-US/short_description.txt || (echo "Missing en-US short_description" && exit 1)
          test -f fastlane/metadata/android/en-US/full_description.txt || (echo "Missing en-US full_description" && exit 1)
          test -f fastlane/metadata/android/de-DE/title.txt || (echo "Missing de-DE title" && exit 1)
          test -f fastlane/metadata/android/de-DE/short_description.txt || (echo "Missing de-DE short_description" && exit 1)
          test -f fastlane/metadata/android/de-DE/full_description.txt || (echo "Missing de-DE full_description" && exit 1)
          test -f app/src/main/res/values/strings.xml || (echo "Missing base strings" && exit 1)
          test -f app/src/main/res/values-de/strings.xml || (echo "Missing de strings" && exit 1)
          echo "fastlane metadata OK"

      - name: Build release APK (R8)
        run: ./gradlew assembleRelease

      - name: Upload lint report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: autoplay-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
