name: Android CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: '0 6 * * 1' # Weekly Monday 06:00 UTC

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Run Android Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Update lint baseline
        if: github.event_name == 'schedule'
        run: |
          ./gradlew updateLintBaseline --stacktrace
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/lint-baseline.xml
          git commit -m "Update lint baseline [skip ci]" || echo "No baseline changes"
          git push

      - name: Upload lint report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Record Paparazzi screenshots
        run: ./gradlew recordPaparazziDebug

      - name: Validate fastlane metadata
        run: |
          test -f fastlane/metadata/android/en-US/title.txt || (echo "Missing en-US title" && exit 1)
          test -f fastlane/metadata/android/en-US/short_description.txt || (echo "Missing en-US short_description" && exit 1)
          test -f fastlane/metadata/android/en-US/full_description.txt || (echo "Missing en-US full_description" && exit 1)
          test -f fastlane/metadata/android/de-DE/title.txt || (echo "Missing de-DE title" && exit 1)
          test -f fastlane/metadata/android/de-DE/short_description.txt || (echo "Missing de-DE short_description" && exit 1)
          test -f fastlane/metadata/android/de-DE/full_description.txt || (echo "Missing de-DE full_description" && exit 1)
          test -f app/src/main/res/values/strings.xml || (echo "Missing base strings" && exit 1)
          test -f app/src/main/res/values-de/strings.xml || (echo "Missing de strings" && exit 1)
          echo "fastlane metadata OK"

      - name: Setup release keystore
        run: |
          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "${KEYSTORE_BASE64}" | base64 -d > app/release.keystore
          else
            keytool -genkey -v -keystore app/release.keystore \
              -alias "${KEY_ALIAS:-autoplay}" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "${KEYSTORE_PASSWORD:-autoplay}" \
              -keypass "${KEYSTORE_PASSWORD:-autoplay}" \
              -dname "CN=AutoPlay, OU=AutoPlay, O=AutoPlay, L=Unknown, ST=Unknown, C=US"
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

      - name: Build release APK (R8)
        run: ./gradlew assembleRelease

      - name: Generate JaCoCo coverage report
        run: ./gradlew :app:jacocoTestReport

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage
          path: app/build/reports/jacoco/jacocoTestReport/

      - name: Generate coverage badge
        uses: cicirello/jacoco-badge-generator@v2
        with:
          jacoco-csv-file: app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.csv
          badges-directory: .github/badges
          generate-coverage-badge: true
          generate-branches-badge: true
          fail-if-coverage-less-than: 0
          on-missing-report: fail

      - name: Commit coverage badge
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/badges/*.svg
          git commit -m "Update coverage badge [skip ci]" || echo "No badge changes"
          git push origin HEAD:master

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: autoplay-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
