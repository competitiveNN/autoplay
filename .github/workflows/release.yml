name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Setup release keystore
        run: |
          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "${KEYSTORE_BASE64}" | base64 -d > app/release.keystore
          else
            # No secret provided: build debug first to create the debug keystore,
            # then copy it for release signing.
            ./gradlew assembleDebug --no-daemon
            mkdir -p app/
            cp ~/.android/debug.keystore app/release.keystore
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Validate fastlane metadata
        run: |
          test -f fastlane/metadata/android/en-US/title.txt || (echo "Missing en-US title" && exit 1)
          test -f fastlane/metadata/android/en-US/short_description.txt || (echo "Missing en-US short_description" && exit 1)
          test -f fastlane/metadata/android/en-US/full_description.txt || (echo "Missing en-US full_description" && exit 1)
          test -f fastlane/metadata/android/de-DE/title.txt || (echo "Missing de-DE title" && exit 1)
          test -f fastlane/metadata/android/de-DE/short_description.txt || (echo "Missing de-DE short_description" && exit 1)
          test -f fastlane/metadata/android/de-DE/full_description.txt || (echo "Missing de-DE full_description" && exit 1)
          echo "fastlane metadata OK"

      - name: Build signed release AAB + APK
        run: ./gradlew bundleRelease assembleRelease --console=plain
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Generate JaCoCo coverage report
        run: ./gradlew :app:jacocoTestReport

      - name: Generate coverage badge
        uses: cicirello/jacoco-badge-generator@v2
        with:
          jacoco-csv-file: app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.csv
          badges-directory: .github/badges
          generate-coverage-badge: true
          generate-branches-badge: true
          on-missing-report: fail

      - name: Commit coverage badge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/badges/*.svg
          git commit -m "Update coverage badge [skip ci]" || echo "No badge changes"
          git push

      - name: Extract changelog for tag
        id: changelog
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "## v$TAG" > /tmp/release_body.md
          awk '/^## v'"$TAG"'/{flag=1; next} /^## v/{flag=0} flag' CHANGELOG.md >> /tmp/release_body.md || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: AutoPlay v${{ steps.changelog.outputs.version }}
          body_path: /tmp/release_body.md
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          generate_release_notes: true