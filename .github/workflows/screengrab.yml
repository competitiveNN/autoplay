name: Screengrab

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  screengrab:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          target: google_apis

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Install fastlane + bundle
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libegl1 libxkbcommon0 libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 libxcb-xfixes0 libxcb-xkb1 libdbus-1-3
          sudo apt-get install -y -qq ruby ruby-dev
          gem install fastlane -N --no-document
          bundle config set --local path 'vendor/bundle'
          bundle install --jobs 4

      - name: Create emulator and take screenshots
        uses: ReactiveCircus/android-emulator-runner@v2.29.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: screengrab
          script: ./gradlew assembleDebug && bundle exec fastlane screengrab

      - name: Commit screenshots
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fastlane/metadata/android/**/*.png
          git commit -m "Update Play Store screenshots [skip ci]" || echo "No screenshot changes"
          git push

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: play-store-screenshots
          path: fastlane/metadata/android/**/*.png