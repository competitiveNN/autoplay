name: Screengrab

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  screengrab:
    runs-on: macos-15-intel
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools emulator

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Install fastlane + bundle
        run: |
          bundle config set --local path 'vendor/bundle'
          bundle install --jobs 4

      - name: Create emulator and take screenshots
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: screengrab
          disk-size: 4096M
          emulator-boot-timeout: 900
          script: |
            ./gradlew assembleDebug assembleDebugAndroidTest
            i=0; while [ $i -lt 60 ]; do if adb -s emulator-5554 shell pm list packages >/dev/null 2>&1; then echo "Package manager ready"; break; fi; sleep 5; i=$((i + 1)); done
            # `adb install` on the macOS emulator runner intermittently fails with
            # "Failure calling service package: Broken pipe (32)". Recycling the
            # server and retrying the lane usually clears it.
            adb kill-server
            adb start-server
            adb wait-for-device
            sleep 10
            n=0; until bundle exec fastlane screenshots; do n=$((n+1)); if [ $n -ge 3 ]; then echo "fastlane screenshots failed after $n attempts"; exit 1; fi; echo "fastlane screenshots failed (attempt $n), retrying in 15s..."; sleep 15; done

      - name: Commit screenshots
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fastlane/metadata/android/**/*.png
          git commit -m "Update Play Store screenshots [skip ci]" || echo "No screenshot changes"
          git push

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: play-store-screenshots
          path: fastlane/metadata/android/**/*.png