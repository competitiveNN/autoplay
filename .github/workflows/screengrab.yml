name: Screengrab

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  screengrab:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools emulator

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Install fastlane + bundle
        run: |
          export GEM_HOME="$HOME/.gem"
          export GEM_PATH="$HOME/.gem/ruby/$(ruby -e 'print RbConfig::["ruby_version"]')"
          export PATH="$GEM_PATH/bin:$PATH"
          gem install fastlane --user-install --no-document
          bundle config set --local path 'vendor/bundle'
          bundle install --jobs 4

      - name: Create emulator and take screenshots
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: arm64-v8a
          profile: pixel_6
          avd-name: screengrab
          emulator-boot-timeout: 900
          script: ./gradlew assembleDebug && bundle exec fastlane screengrab

      - name: Commit screenshots
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fastlane/metadata/android/**/*.png
          git commit -m "Update Play Store screenshots [skip ci]" || echo "No screenshot changes"
          git push

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: play-store-screenshots
          path: fastlane/metadata/android/**/*.png